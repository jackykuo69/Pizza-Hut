<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>COCA 講師後台</title><style>
:root{--brand:#e31b23;--ink:#172033;--muted:#667085;--line:#d0d5dd;--bg:#faf7f5;--danger:#b42318}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1280px;margin:24px auto;padding:0 16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0 0 8px}.hint{color:var(--muted);line-height:1.6}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}button.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}button.danger{background:var(--danger)}button.small{padding:6px 10px;font-size:13px}table{border-collapse:collapse;width:100%;font-size:14px}th{background:var(--brand);color:#fff;text-align:left;padding:10px;border:1px solid #c8161d;white-space:nowrap}td{padding:10px;border:1px solid #e4e7ec;vertical-align:top;line-height:1.55}tr:nth-child(even) td{background:#fff8f8}.pill{display:inline-block;background:#fff1f1;color:var(--brand);border-radius:999px;padding:3px 8px;font-weight:800;font-size:12px}.kv{display:grid;grid-template-columns:180px 1fr;gap:10px;border-bottom:1px solid #eef2f7;padding:8px 0}.kv strong{color:#344054}dialog{border:0;border-radius:16px;max-width:1100px;width:92%;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.24)}.dialog-head{display:flex;justify-content:space-between;align-items:center;background:#fff1f1;padding:14px 18px;border-bottom:1px solid #ffd7d7}.dialog-body{padding:18px;max-height:78vh;overflow:auto}pre{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;font-size:13px;line-height:1.5}.admin-gate{max-width:520px;margin:80px auto;background:#fff;border:1px solid #f3c7c9;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(16,24,40,.08)}.admin-gate input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;margin:8px 0 12px}.error{color:var(--danger);font-weight:800;margin-top:8px}@media(max-width:700px){.kv{grid-template-columns:1fr}}
</style></head><body><main><div class="top"><div><h1>COCA 講師後台</h1><div class="hint">查看各組完成資料，並匯出完整 Excel。</div></div><div class="actions"><button id="refresh">重新整理</button><button class="secondary" id="download">下載完整 Excel</button></div></div><div id="status" class="panel hint">讀取中...</div><div class="panel"><table id="tbl"><thead><tr><th>組別</th><th>門店</th><th>商圈判讀</th><th>副型／補充</th><th>目前階段</th><th>完成狀態</th><th>更新時間</th><th>操作</th></tr></thead><tbody></tbody></table></div></main><dialog id="detailDialog"><div class="dialog-head"><strong>完整資料</strong><button class="secondary" onclick="document.getElementById('detailDialog').close()">關閉</button></div><div class="dialog-body" id="detailBody"></div></dialog>
<script>
let rows=[];let usingBackend=false;function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}function xml(v){return String(v??'').replace(/[<>&'"]/g,s=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[s]));}function parse(v,f={}){try{return typeof v==='string'?JSON.parse(v||'{}'):(v||f)}catch(e){return f}}function stage(n){return {0:'Step 0',1:'Step 1',2:'Step 2',3:'Step 3',4:'Step 4'}[n]||n||0}function status(s){const o=parse(s,{});return Object.keys(o).filter(k=>o[k]).map(k=>'Step '+k).join('、')||'尚未完成'}function join(v){if(Array.isArray(v))return v.join('；');if(v&&typeof v==='object')return Object.values(v).join('；');return v||''}function dataOf(r){return parse(r.data,{})}
async function load(){const st=document.getElementById('status');try{const r=await fetch('/api/submissions');const j=await r.json();if(!j.ok)throw new Error(j.error||'API 尚未可用');rows=j.items||[];usingBackend=true;st.innerHTML=`後端資料庫：<span class="pill">已連線</span>，共 ${rows.length} 組資料`;}catch(e){rows=parse(localStorage.getItem('coc_submissions')||'[]',[]);usingBackend=false;st.textContent=`後端資料庫尚未連線，改讀本機測試資料，共 ${rows.length} 組資料。`;}render();}
function render(){document.querySelector('#tbl tbody').innerHTML=rows.map((r,i)=>`<tr><td>${esc(r.group_name)}</td><td>${esc(r.store_name)}</td><td>${esc(r.district_type)}</td><td>${esc(r.district_subtype)}</td><td>${esc(stage(r.current_stage))}</td><td>${esc(status(r.stage_status))}</td><td>${esc(r.updated_at)}</td><td><button class="small secondary" onclick="viewRow(${i})">查看</button> <button class="small danger" onclick="deleteRow(${i})">刪除</button></td></tr>`).join('')}
function kv(k,v){return `<div class="kv"><strong>${esc(k)}</strong><div>${v}</div></div>`}function section(t,c){return `<h3>${esc(t)}</h3>${c}`}
function renderData(d){let h='';h+=section('Step 0｜商圈判讀',`${kv('商圈主副型',esc(d.step0?.typeLabel||''))}${kv('分數',esc(JSON.stringify(d.step0?.scores||{})))}${kv('經營目標',esc(d.step0?.q5Type||d.step0?.answers?.q5?.primary||''))}`);if(d.step1?.groups){h+=section('Step 1｜三類顧客需求地圖',Object.values(d.step1.groups).map(g=>`${kv(g.name+'｜出現情境',esc(g.context))}${kv(g.name+'｜需求痛點',esc(g.pain))}${kv(g.name+'｜選擇理由',esc(g.value))}`).join(''));}if(d.step2?.layers){h+=section('Step 2｜四層作戰條件',Object.values(d.step2.layers).map(l=>`${kv(l.title+'｜勾選',esc(join(l.items)))}${kv(l.title+'｜補充',esc(l.note))}`).join(''));}if(d.step3){h+=section('Step 3｜限制與影響',`${kv('限制',esc(join(d.step3.constraints)))}${kv('影響',esc(join(d.step3.impacts)))}${kv('處理方向',esc(d.step3.directions))}`);}if(d.priority?.groups){h+=section('客群經營優先判斷',`<table><thead><tr><th>客群</th><th>加權分數</th><th>建議</th><th>低中高</th></tr></thead><tbody>${Object.values(d.priority.groups).map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.total)}</td><td>${esc(g.recommendation)}</td><td>${esc(JSON.stringify(g.levels))}</td></tr>`).join('')}</tbody></table>`);}const cs=d.step4?.candidates||[];if(cs.length){h+=section('候選行動方案',`<table><thead><tr><th>客群</th><th>方案</th><th>理由</th><th>需求</th><th>資源</th><th>限制</th><th>測試</th><th>指標</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.customer)}</td><td>${esc(c.name)}</td><td>${esc(c.reason)}</td><td>${esc(c.need)}</td><td>${esc(c.resource)}</td><td>${esc(c.constraint)}</td><td>${esc(c.test)}</td><td>${esc(c.metric)}</td></tr>`).join('')}</tbody></table>`);}if(d.step4?.evaluation){h+=section('方案評估',`<table><thead><tr><th>方案</th><th>總分</th><th>分數</th></tr></thead><tbody>${d.step4.evaluation.map(e=>`<tr><td>${esc(e.candidate?.name)}</td><td>${esc(e.total)}</td><td>${esc(JSON.stringify(e.scores))}</td></tr>`).join('')}</tbody></table>`);}if(d.final?.candidate){const c=d.final.candidate;h+=section('最終 Action Design',`${kv('服務客群',esc(c.customer))}${kv('方案',esc(c.name))}${kv('理由',esc(c.reason))}${kv('需求',esc(c.need))}${kv('資源',esc(c.resource))}${kv('限制',esc(c.constraint))}${kv('測試',esc(c.test))}${kv('指標',esc(c.metric))}`);}h+=section('原始資料',`<pre>${esc(JSON.stringify(d,null,2))}</pre>`);return h;}
function viewRow(i){try{const r=rows[i];const d=dataOf(r);document.getElementById('detailBody').innerHTML=`${kv('組別',esc(r.group_name))}${kv('門店',esc(r.store_name))}${kv('商圈判讀',esc(r.district_type))}${kv('更新時間',esc(r.updated_at))}${renderData(d)}`;document.getElementById('detailDialog').showModal();}catch(e){alert('查看資料時發生錯誤：'+e.message)}}
async function deleteRow(i){const r=rows[i];if(!confirm(`確定刪除「${r.group_name||''}／${r.store_name||''}」？`))return;if(usingBackend){const resp=await fetch('/api/submissions?id='+encodeURIComponent(r.id),{method:'DELETE'});const j=await resp.json();if(!j.ok){alert('刪除失敗');return;}}else{localStorage.setItem('coc_submissions',JSON.stringify(rows.filter(x=>x.id!==r.id)))}load();}
function sheet(name,rs){return `<Worksheet ss:Name="${xml(name)}"><Table>${rs.map(r=>`<Row>${r.map(c=>`<Cell><Data ss:Type="String">${xml(c)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`}
function excel(){const overview=[['組別','門店','商圈判讀','副型／補充','目前階段','完成狀態','更新時間']];const coc=[['組別','門店','商圈判讀','Step0分數','三類顧客需求','O四層盤點','限制影響','客群優先判斷','最終方案','最終理由','測試方式','觀察指標']];const candidates=[['組別','門店','客群','方案','理由','需求','資源','限制','測試','指標']];const evals=[['組別','門店','方案','總分','效益','可行性','成本','風險性','測試性','是否當選']];rows.forEach(r=>{const d=dataOf(r);overview.push([r.group_name,r.store_name,r.district_type,r.district_subtype,stage(r.current_stage),status(r.stage_status),r.updated_at]);const gtxt=Object.values(d.step1?.groups||{}).map(g=>`${g.name}: 情境=${g.context}; 痛點=${g.pain}; 理由=${g.value}`).join('\n');const otxt=Object.values(d.step2?.layers||{}).map(l=>`${l.title}: ${join(l.items)}; ${l.note||''}`).join('\n');const ptxt=Object.values(d.priority?.groups||{}).map(g=>`${g.name}: ${g.total}/${g.recommendation}`).join('；');const f=d.final?.candidate||{};coc.push([r.group_name,r.store_name,d.step0?.typeLabel||'',JSON.stringify(d.step0?.scores||{}),gtxt,otxt,`${join(d.step3?.constraints)} | ${join(d.step3?.impacts)} | ${d.step3?.directions||''}`,ptxt,f.name||'',f.reason||'',f.test||'',f.metric||'']);(d.step4?.candidates||[]).forEach(c=>candidates.push([r.group_name,r.store_name,c.customer,c.name,c.reason,c.need,c.resource,c.constraint,c.test,c.metric]));(d.step4?.evaluation||[]).forEach(e=>evals.push([r.group_name,r.store_name,e.candidate?.name,e.total,e.scores?.benefit,e.scores?.feasibility,e.scores?.cost,e.scores?.risk,e.scores?.testability,d.final?.candidate?.name===e.candidate?.name?'當選':'']));});const wb=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${sheet('總覽',overview)}${sheet('COCA完整資料',coc)}${sheet('候選行動',candidates)}${sheet('方案評估',evals)}</Workbook>`;const blob=new Blob(['\ufeff'+wb],{type:'application/vnd.ms-excel;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='COCA_商圈活動完整資料.xls';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('refresh').addEventListener('click',load);document.getElementById('download').addEventListener('click',excel);load();
</script><script>(function(){const ADMIN_PASSWORD='coc-admin';function show(){document.getElementById('adminGate').style.display='none';document.getElementById('adminContent').style.display=''}window.checkAdminPassword=function(){const input=document.getElementById('adminPassword');const msg=document.getElementById('adminLoginMsg');if((input.value||'').trim()===ADMIN_PASSWORD){sessionStorage.setItem('cocAdminAuthed','1');show()}else msg.textContent='密碼不正確，請確認後台密碼。'};document.addEventListener('DOMContentLoaded',()=>{const kids=Array.from(document.body.children);const wrap=document.createElement('div');wrap.id='adminContent';wrap.style.display='none';kids.forEach(el=>{if(el.id!=='adminGate')wrap.appendChild(el)});document.body.appendChild(wrap);const gate=document.createElement('div');gate.id='adminGate';gate.className='admin-gate';gate.innerHTML='<h1>COCA 講師後台</h1><p class="hint">此頁僅供講師與工作人員使用。請輸入後台密碼。</p><input id="adminPassword" type="password" placeholder="請輸入後台密碼" onkeydown="if(event.key===\'Enter\') checkAdminPassword()"><button onclick="checkAdminPassword()">進入後台</button><div id="adminLoginMsg" class="error"></div><p class="hint" style="font-size:13px;margin-top:16px;">課堂 MVP 預設密碼：coc-admin。正式課程建議改為 Cloudflare Access。</p>';document.body.insertBefore(gate,wrap);if(sessionStorage.getItem('cocAdminAuthed')==='1')show();});})();</script></body></html>
