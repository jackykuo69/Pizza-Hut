<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COC 講師後台</title>
<style>
  :root{--ph-red:#e31b23;--ph-red-soft:#fff1f1;--ph-red-line:#f3c7c9;--ph-bg:#faf7f5;--ink:#172033;--muted:#667085;--line:#d0d5dd;--danger:#b42318;}
  body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:var(--ph-bg);color:var(--ink)}
  main{max-width:1280px;margin:24px auto;padding:0 16px}
  .top{display:flex;justify-content:space-between;gap:12px;align-items:center}
  h1{margin:0 0 8px}
  .hint{color:var(--muted);line-height:1.6}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
  button{border:0;background:var(--ph-red);color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}
  button.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}
  button.danger{background:var(--danger)}
  button.small{padding:6px 10px;font-size:13px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th{background:var(--ph-red);color:#fff;text-align:left;padding:10px;border:1px solid #c8161d;white-space:nowrap}
  td{padding:10px;border:1px solid #e4e7ec;vertical-align:top;line-height:1.55}
  tr:nth-child(even) td{background:#fff8f8}
  .warn{background:#fff8e6;border:1px solid #fedf89;color:#7a4d00;border-radius:10px;padding:12px;margin-top:10px}
  .pill{display:inline-block;background:#fff1f1;color:var(--ph-red);border-radius:999px;padding:3px 8px;font-weight:800;font-size:12px}
  .admin-gate{max-width:520px;margin:80px auto;background:#fff;border:1px solid var(--ph-red-line);border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(16,24,40,.08)}
  .admin-gate h1{font-size:26px;margin:0 0 8px;color:var(--ink)}
  .admin-gate p{color:var(--muted);line-height:1.6}
  .admin-gate input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;margin:10px 0}
  .admin-gate button{background:var(--ph-red)}
  .admin-gate .error{color:var(--danger);font-weight:800;margin-top:10px}
  dialog{border:0;border-radius:16px;max-width:920px;width:calc(100% - 32px);padding:0;box-shadow:0 24px 80px rgba(16,24,40,.24)}
  dialog::backdrop{background:rgba(15,23,42,.45)}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
  .modal-body{padding:18px 20px;max-height:72vh;overflow:auto}
  .kv{display:grid;grid-template-columns:160px 1fr;border-bottom:1px solid #eef2f6;padding:8px 0;gap:12px}
  .kv strong{color:#344054}
  pre{background:#f8fafc;border:1px solid #e4e7ec;border-radius:12px;padding:12px;white-space:pre-wrap;word-break:break-word;font-family:"Consolas","Courier New",monospace;font-size:13px}
.admin-logo{width:64px;height:64px;object-fit:contain}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>COC 講師後台</h1>
      <div class="hint">查看各組填寫進度與商圈分類。可查看單筆內容，也可刪除測試或不必要資料。</div>
    </div>
    <img class="admin-logo" src="./assets/pizza-logo.png" alt="Pizza Hut logo">
  </div>

  <div class="warn">此頁僅供講師與工作人員使用。正式上課前，建議先刪除測試資料。</div>

  <div class="panel">
    <div class="actions">
      <button id="refresh">重新整理</button>
      <button class="secondary" id="download">下載完整 Excel</button>
    </div>
    <div id="status" class="hint"></div>
    <div style="overflow:auto">
      <table id="tbl">
        <thead>
          <tr>
            <th>組別</th>
            <th>門店</th>
            <th>商圈類型</th>
            <th>細分情境</th>
            <th>目前階段</th>
            <th>完成狀態</th>
            <th>更新時間</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>

<dialog id="detailDialog">
  <div class="modal-head">
    <h2 style="margin:0">單筆資料查看</h2>
    <button class="secondary" onclick="detailDialog.close()">關閉</button>
  </div>
  <div class="modal-body" id="detailBody"></div>
</dialog>

<script>
let rows = [];
let usingBackend = false;

function escapeHtml(v){
  return String(v ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeXml(v){
  return String(v ?? '').replace(/[<>&'"]/g, s => ({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[s]));
}
function parseJson(v, fallback = {}){
  try { return typeof v === 'string' ? JSON.parse(v || '{}') : (v || fallback); }
  catch(e){ return fallback; }
}
function parseStatus(s){
  const o = parseJson(s, {});
  const names = {1:'Step 1',2:'Step 2',3:'Step 3',4:'Step 4'};
  const out = Object.keys(o || {}).filter(k => o[k]).map(k => names[k] || ('Step '+k));
  return out.join('、') || '尚未完成';
}
function currentStageLabel(n){
  const map = {0:'Step 0',1:'Step 1',2:'Step 2',3:'Step 3',4:'Step 4'};
  return map[n] || n || 0;
}
function arrText(v){
  if(Array.isArray(v)) return v.filter(x => x !== undefined && x !== null && String(x).trim() !== '').join('；');
  return v ? String(v) : '';
}
function normalizePlan(plan){
  if(!Array.isArray(plan) || !plan.length) return [];
  if(Array.isArray(plan[0])) return plan;
  if(typeof plan[0] === 'string') return [plan];
  if(plan.plan && Array.isArray(plan.plan)) return [plan.plan];
  return [];
}
function getFinalPlan(data){
  const finalPlans = normalizePlan(data.final);
  if(finalPlans.length) return finalPlans[0];
  const selectedPlans = normalizePlan(data.selectedPlan);
  if(selectedPlans.length) return selectedPlans[0];
  return null;
}
function safePlanCell(plan, idx){
  return Array.isArray(plan) ? (plan[idx] || '') : '';
}

async function load(){
  const status = document.getElementById('status');
  try{
    const r = await fetch('/api/submissions');
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'API 尚未可用');
    rows = j.items || [];
    usingBackend = true;
    status.innerHTML = `後端資料庫：<span class="pill">已連線</span>，共 ${rows.length} 組資料`;
  }catch(e){
    rows = JSON.parse(localStorage.getItem('coc_submissions') || '[]');
    usingBackend = false;
    status.innerHTML = `後端資料庫尚未連線，改讀本機測試資料，共 ${rows.length} 組資料。`;
  }
  render();
}
function render(){
  const body = document.querySelector('#tbl tbody');
  body.innerHTML = rows.map((r, i) => `
    <tr>
      <td>${escapeHtml(r.group_name)}</td>
      <td>${escapeHtml(r.store_name)}</td>
      <td>${escapeHtml(r.district_type)}</td>
      <td>${escapeHtml(r.district_subtype)}</td>
      <td>${escapeHtml(currentStageLabel(r.current_stage))}</td>
      <td>${escapeHtml(parseStatus(r.stage_status))}</td>
      <td>${escapeHtml(r.updated_at)}</td>
      <td>
        <button class="small secondary" onclick="viewRow(${i})">查看</button>
        <button class="small danger" onclick="deleteRow(${i})">刪除</button>
      </td>
    </tr>
  `).join('');
}
function section(title, content){
  return `<h3>${escapeHtml(title)}</h3>${content}`;
}
function list(items){
  if(!Array.isArray(items) || !items.length) return '<div class="hint">無資料</div>';
  return `<ul>${items.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`;
}
function kv(label, content){
  return `<div class="kv"><strong>${escapeHtml(label)}</strong><div>${content}</div></div>`;
}
function renderCandidateTable(candidates){
  if(!Array.isArray(candidates) || !candidates.length) return '<div class="hint">無資料</div>';
  return `<table>
    <thead><tr><th>候選行動</th><th>回應需求</th><th>資源做法</th><th>需注意限制</th><th>觀察指標</th></tr></thead>
    <tbody>${candidates.map(r=>`
      <tr>
        <td>${escapeHtml(r?.[0])}</td>
        <td>${escapeHtml(r?.[1])}</td>
        <td>${escapeHtml(r?.[2])}</td>
        <td>${escapeHtml(r?.[3])}</td>
        <td>${escapeHtml(r?.[4])}</td>
      </tr>`).join('')}</tbody>
  </table>`;
}
function renderEvaluationTable(evaluation, selectedPlan){
  if(!Array.isArray(evaluation) || !evaluation.length) return '<div class="hint">無資料</div>';
  const selectedName = Array.isArray(selectedPlan) ? selectedPlan[0] : '';
  return `<table>
    <thead><tr><th>候選方案</th><th>效益</th><th>可行性</th><th>成本</th><th>風險性</th><th>測試性</th><th>總分</th><th>是否當選</th></tr></thead>
    <tbody>${evaluation.map(e=>{
      const plan = Array.isArray(e.plan) ? e.plan : [];
      const s = e.scores || {};
      const isWinner = selectedName && plan[0] === selectedName;
      return `<tr>
        <td>${escapeHtml(plan[0])}</td>
        <td>${escapeHtml(s.benefit)}</td>
        <td>${escapeHtml(s.feasibility)}</td>
        <td>${escapeHtml(s.cost)}</td>
        <td>${escapeHtml(s.risk)}</td>
        <td>${escapeHtml(s.testability)}</td>
        <td>${escapeHtml(e.total)}</td>
        <td>${isWinner ? '◎ 當選' : ''}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}
function renderFinalPlan(plan){
  const plans = normalizePlan(plan);
  if(!plans.length) return '<div class="hint">無資料</div>';
  return `<table>
    <thead><tr><th>行動</th><th>回應需求</th><th>資源做法</th><th>需注意限制</th><th>觀察指標</th></tr></thead>
    <tbody>${plans.map(r=>`
      <tr>
        <td>${escapeHtml(r?.[0])}</td>
        <td>${escapeHtml(r?.[1])}</td>
        <td>${escapeHtml(r?.[2])}</td>
        <td>${escapeHtml(r?.[3])}</td>
        <td>${escapeHtml(r?.[4])}</td>
      </tr>`).join('')}</tbody>
  </table>`;
}
function renderData(data){
  let html = '';
  if(data.step1){
    html += section('Step 1｜顧客需求與痛點', `
      ${kv('目標顧客', list(data.step1.customers))}
      ${kv('出現情境', list(data.step1.contexts))}
      ${kv('需求與痛點', list(data.step1.pains))}
      ${kv('可能選擇我們的理由', list(data.step1.value))}
      ${data.step1.limits ? kv('門市限制', list(data.step1.limits)) : ''}
    `);
  }
  if(data.step2){
    html += section('Step 2｜資源與做法', `
      ${kv('既有資源', list(data.step2.resources))}
      ${kv('補充做法／優勢／盲點', escapeHtml(data.step2.note || ''))}
    `);
  }
  if(data.step3){
    html += section('Step 3｜條件與限制', `
      ${kv('條件與限制', list(data.step3.constraints))}
      ${kv('造成的影響', list(data.step3.impacts))}
      ${kv('相對價值或處理方向', list(data.step3.directions))}
    `);
  }
  if(data.step4?.candidates){
    html += section('Step 4｜候選行動', renderCandidateTable(data.step4.candidates));
  }
  if(data.evaluation){
    html += section('方案評估', renderEvaluationTable(data.evaluation, data.selectedPlan || data.final));
  }
  const finalPlan = data.final || data.selectedPlan;
  if(finalPlan){
    html += section('最終選定行動', renderFinalPlan(finalPlan));
  }
  if(!html) html = '<div class="hint">尚無詳細填寫內容。</div>';
  html += section('原始資料', `<pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>`);
  return html;
}
function viewRow(i){
  try{
    const r = rows[i];
    const data = parseJson(r.data, {});
    document.getElementById('detailBody').innerHTML = `
      ${kv('組別', escapeHtml(r.group_name))}
      ${kv('門店', escapeHtml(r.store_name))}
      ${kv('商圈類型', escapeHtml(r.district_type))}
      ${kv('細分情境', escapeHtml(r.district_subtype))}
      ${kv('目前階段', escapeHtml(currentStageLabel(r.current_stage)))}
      ${kv('完成狀態', escapeHtml(parseStatus(r.stage_status)))}
      ${kv('更新時間', escapeHtml(r.updated_at))}
      ${renderData(data)}
    `;
    document.getElementById('detailDialog').showModal();
  }catch(err){
    alert('查看資料時發生錯誤：' + (err.message || err));
    console.error(err);
  }
}
async function deleteRow(i){
  const r = rows[i];
  const label = `${r.group_name || '未命名組別'}${r.store_name ? '／' + r.store_name : ''}`;
  if(!confirm(`確定要刪除「${label}」這筆資料嗎？此動作無法復原。`)) return;

  if(usingBackend){
    const resp = await fetch('/api/submissions?id=' + encodeURIComponent(r.id), { method:'DELETE' });
    const j = await resp.json();
    if(!j.ok){
      alert('刪除失敗：' + (j.error || '未知錯誤'));
      return;
    }
  }else{
    const all = JSON.parse(localStorage.getItem('coc_submissions') || '[]').filter(x => x.id !== r.id);
    localStorage.setItem('coc_submissions', JSON.stringify(all));
  }
  await load();
}

function workbookSheet(name, rows){
  const safeName = String(name).slice(0,31).replace(/[\\/?*[\]:]/g, '');
  const xmlRows = rows.map(row => `<Row>${row.map(v => `<Cell><Data ss:Type="String">${escapeXml(v)}</Data></Cell>`).join('')}</Row>`).join('');
  return `<Worksheet ss:Name="${escapeXml(safeName)}"><Table>${xmlRows}</Table></Worksheet>`;
}
function buildExportSheets(){
  const overview = [['組別','門店','商圈類型','細分情境','目前階段','完成狀態','更新時間']];
  const coc = [['組別','門店','商圈類型','細分情境','更新時間','目標顧客','出現情境','需求與痛點','可能選擇我們的理由','既有資源','補充做法／優勢／盲點','條件與限制','造成的影響','相對價值或處理方向','最終行動','最終回應需求','最終資源做法','最終限制','最終觀察指標']];
  const candidates = [['組別','門店','編號','候選行動','回應需求','資源做法','需注意限制','觀察指標']];
  const evaluation = [['組別','門店','候選方案','效益','可行性','成本','風險性','測試性','總分','是否當選']];
  const finalActions = [['組別','門店','商圈類型','細分情境','最終行動','具體做法','回應需求','資源做法','條件限制','觀察指標']];

  rows.forEach(r => {
    const data = parseJson(r.data, {});
    const plan = getFinalPlan(data);
    overview.push([r.group_name,r.store_name,r.district_type,r.district_subtype,currentStageLabel(r.current_stage),parseStatus(r.stage_status),r.updated_at]);

    coc.push([
      r.group_name, r.store_name, r.district_type, r.district_subtype, r.updated_at,
      arrText(data.step1?.customers), arrText(data.step1?.contexts), arrText(data.step1?.pains), arrText(data.step1?.value),
      arrText(data.step2?.resources), data.step2?.note || '',
      arrText(data.step3?.constraints), arrText(data.step3?.impacts), arrText(data.step3?.directions),
      safePlanCell(plan,0), safePlanCell(plan,1), safePlanCell(plan,2), safePlanCell(plan,3), safePlanCell(plan,4)
    ]);

    (data.step4?.candidates || []).forEach((c, idx) => {
      candidates.push([r.group_name, r.store_name, idx+1, c?.[0], c?.[1], c?.[2], c?.[3], c?.[4]]);
    });

    const selectedName = plan?.[0] || '';
    (data.evaluation || []).forEach(e => {
      const p = Array.isArray(e.plan) ? e.plan : [];
      const s = e.scores || {};
      evaluation.push([r.group_name, r.store_name, p[0] || '', s.benefit ?? '', s.feasibility ?? '', s.cost ?? '', s.risk ?? '', s.testability ?? '', e.total ?? '', selectedName && p[0] === selectedName ? '當選' : '']);
    });

    if(plan){
      finalActions.push([
        r.group_name, r.store_name, r.district_type, r.district_subtype,
        safePlanCell(plan,0),
        '先小規模試行，確認人力、動線、規則與成本可控後再放大。',
        safePlanCell(plan,1), safePlanCell(plan,2), safePlanCell(plan,3), safePlanCell(plan,4)
      ]);
    }
  });

  return {overview, coc, candidates, evaluation, finalActions};
}
function excel(){
  const sheets = buildExportSheets();
  const workbook = `<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:html="http://www.w3.org/TR/REC-html40">
 ${workbookSheet('總覽', sheets.overview)}
 ${workbookSheet('COC完整資料', sheets.coc)}
 ${workbookSheet('候選行動', sheets.candidates)}
 ${workbookSheet('方案評估', sheets.evaluation)}
 ${workbookSheet('最終ActionDesign', sheets.finalActions)}
</Workbook>`;
  const blob = new Blob(['\ufeff' + workbook], {type:'application/vnd.ms-excel;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'COC_商圈活動完整資料.xls';
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById('refresh').addEventListener('click', load);
document.getElementById('download').addEventListener('click', excel);
load();
</script>

<script>
(function(){
  const ADMIN_PASSWORD = "coc-admin";
  function showAdmin(){
    const gate = document.getElementById("adminGate");
    const content = document.getElementById("adminContent");
    if(gate) gate.style.display = "none";
    if(content) content.style.display = "";
  }
  window.checkAdminPassword = function(){
    const input = document.getElementById("adminPassword");
    const msg = document.getElementById("adminLoginMsg");
    if((input.value || "").trim() === ADMIN_PASSWORD){
      sessionStorage.setItem("cocAdminAuthed","1");
      showAdmin();
    }else{
      msg.textContent = "密碼不正確，請確認後台密碼。";
    }
  };
  document.addEventListener("DOMContentLoaded", function(){
    const bodyChildren = Array.from(document.body.children);
    const wrapper = document.createElement("div");
    wrapper.id = "adminContent";
    wrapper.style.display = "none";
    bodyChildren.forEach(el => {
      if(el.id !== "adminGate") wrapper.appendChild(el);
    });
    document.body.appendChild(wrapper);

    const gate = document.createElement("div");
    gate.id = "adminGate";
    gate.className = "admin-gate";
    gate.innerHTML = `
      <h1>COC 講師後台</h1>
      <p>此頁僅供講師與工作人員使用。請輸入後台密碼。</p>
      <input id="adminPassword" type="password" placeholder="請輸入後台密碼" onkeydown="if(event.key==='Enter') checkAdminPassword()">
      <button onclick="checkAdminPassword()">進入後台</button>
      <div id="adminLoginMsg" class="error"></div>
      <p style="font-size:13px;margin-top:16px;">課堂 MVP 預設密碼：coc-admin。正式課程建議改為 Cloudflare Access 或動態密碼。</p>
    `;
    document.body.insertBefore(gate, wrapper);

    if(sessionStorage.getItem("cocAdminAuthed")==="1") showAdmin();
  });
})();
</script>
</body>
</html>
