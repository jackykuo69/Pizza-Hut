<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>COC 講師後台</title><style>body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:#f3f5f7;color:#172033}main{max-width:1180px;margin:24px auto;padding:0 16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0 0 8px}.hint{color:#667085;line-height:1.6}.panel{background:#fff;border:1px solid #d0d5dd;border-radius:14px;padding:18px;margin-top:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button{border:0;background:#62a53a;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.secondary{border:1px solid #d0d5dd;background:#fff;color:#172033}table{border-collapse:collapse;width:100%;font-size:14px}th{background:#62a53a;color:#fff;text-align:left;padding:10px;border:1px solid #79b25b}td{padding:10px;border:1px solid #e4e7ec;vertical-align:top;line-height:1.55}tr:nth-child(even) td{background:#fafcf9}.warn{background:#fff8e6;border:1px solid #fedf89;color:#7a4d00;border-radius:10px;padding:12px;margin-top:10px}.pill{display:inline-block;background:#eef7e8;color:#3e7f24;border-radius:999px;padding:3px 8px;font-weight:800;font-size:12px}</style></head><body><main><div class="top"><div><h1>COC 講師後台</h1><div class="hint">查看各組填寫進度與商圈分類。正式課程需連接 Cloudflare D1 才能跨裝置收集所有小組資料。</div></div><a href="/" class="hint">返回學員端</a></div><div class="warn">若尚未設定 Cloudflare D1，本頁只會顯示同一瀏覽器 localStorage 的測試資料；正式上課請完成 D1 綁定。</div><div class="panel"><div class="actions"><button id="refresh">重新整理</button><button class="secondary" id="download">下載 CSV</button></div><div id="status" class="hint"></div><div style="overflow:auto"><table id="tbl"><thead><tr><th>組別</th><th>門店</th><th>商圈類型</th><th>細分情境</th><th>目前階段</th><th>完成狀態</th><th>更新時間</th></tr></thead><tbody></tbody></table></div></div></main><script>let rows=[];function parseStatus(s){try{const o=typeof s==='string'?JSON.parse(s):s;return Object.keys(o||{}).filter(k=>o[k]).map(k=>'Step '+k).join('、')||'尚未完成';}catch(e){return s||'尚未完成'}}async function load(){const status=document.getElementById('status');try{const r=await fetch('/api/submissions');const j=await r.json();if(!j.ok)throw new Error(j.error||'API 尚未可用');rows=j.items||[];status.innerHTML=`後端資料庫：<span class="pill">已連線</span>，共 ${rows.length} 組資料`;}catch(e){rows=JSON.parse(localStorage.getItem('coc_submissions')||'[]');status.innerHTML=`後端資料庫尚未連線，改讀本機測試資料，共 ${rows.length} 組資料。`;}render()}function render(){document.querySelector('#tbl tbody').innerHTML=rows.map(r=>`<tr><td>${r.group_name||''}</td><td>${r.store_name||''}</td><td>${r.district_type||''}</td><td>${r.district_subtype||''}</td><td>${r.current_stage||0}</td><td>${parseStatus(r.stage_status)}</td><td>${r.updated_at||''}</td></tr>`).join('')}function csv(){const head=['組別','門店','商圈類型','細分情境','目前階段','完成狀態','更新時間'];const lines=[head.join(',')].concat(rows.map(r=>[r.group_name,r.store_name,r.district_type,r.district_subtype,r.current_stage,parseStatus(r.stage_status),r.updated_at].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='COC_groups.csv';a.click();URL.revokeObjectURL(a.href)}document.getElementById('refresh').addEventListener('click',load);document.getElementById('download').addEventListener('click',csv);load();</script></body></html>
