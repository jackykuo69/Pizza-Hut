<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>COCA 講師後台</title><style>
:root{--brand:#e31b23;--ink:#172033;--muted:#667085;--line:#d0d5dd;--bg:#faf7f5;--danger:#b42318}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1280px;margin:24px auto;padding:0 16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0 0 8px}.hint{color:var(--muted);line-height:1.6}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}button.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}button.danger{background:var(--danger)}button.small{padding:6px 10px;font-size:13px}table{border-collapse:collapse;width:100%;font-size:14px}th{background:var(--brand);color:#fff;text-align:left;padding:10px;border:1px solid #c8161d;white-space:nowrap}td{padding:10px;border:1px solid #e4e7ec;vertical-align:top;line-height:1.55}tr:nth-child(even) td{background:#fff8f8}.pill{display:inline-block;background:#fff1f1;color:var(--brand);border-radius:999px;padding:3px 8px;font-weight:800;font-size:12px}.kv{display:grid;grid-template-columns:180px 1fr;gap:10px;border-bottom:1px solid #eef2f7;padding:8px 0}.kv strong{color:#344054}dialog{border:0;border-radius:16px;max-width:1120px;width:92%;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.24)}.dialog-head{display:flex;justify-content:space-between;align-items:center;background:#fff1f1;padding:14px 18px;border-bottom:1px solid #ffd7d7}.dialog-body{padding:18px;max-height:78vh;overflow:auto}pre{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;font-size:13px;line-height:1.5}.admin-gate{max-width:520px;margin:80px auto;background:#fff;border:1px solid #f3c7c9;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(16,24,40,.08)}.admin-gate input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;margin:8px 0 12px}.error{color:var(--danger);font-weight:800;margin-top:8px}@media(max-width:700px){.kv{grid-template-columns:1fr}}
</style></head><body><main><div class="top"><div><h1>COCA 講師後台</h1><div class="hint">查看各組完成資料，並匯出完整 Excel。</div></div><div class="actions"><button id="refresh">重新整理</button><button class="secondary" id="download">下載完整 Excel</button></div></div><div id="status" class="panel hint">讀取中...</div><div class="panel"><table id="tbl"><thead><tr><th>組別</th><th>門店</th><th>商圈判讀</th><th>副型／補充</th><th>優先客群</th><th>最終方案</th><th>更新時間</th><th>操作</th></tr></thead><tbody></tbody></table></div></main><dialog id="detailDialog"><div class="dialog-head"><strong>完整資料</strong><button class="secondary" onclick="document.getElementById('detailDialog').close()">關閉</button></div><div id="detailBody" class="dialog-body"></div></dialog><script>
let rows=[];let usingBackend=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function xml(v){return String(v??'').replace(/[<>&'"]/g,s=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[s]));}
function parse(v,f={}){try{return typeof v==='string'?JSON.parse(v||'{}'):(v||f)}catch(e){return f}}
function arr(v){return Array.isArray(v)?v.map(x=>typeof x==='string'?x:(x.text||x.name||JSON.stringify(x))).join('；'):(v||'')}
function getData(r){return parse(r.data,{})}
async function load(){const status=document.getElementById('status');try{const r=await fetch('/api/submissions');const j=await r.json();if(!j.ok)throw new Error(j.error||'API unavailable');rows=j.items||[];usingBackend=true;status.innerHTML=`後端資料庫：<span class="pill">已連線</span>，共 ${rows.length} 組資料`;}catch(e){rows=JSON.parse(localStorage.getItem('coc_submissions')||'[]');usingBackend=false;status.textContent=`後端資料庫尚未連線，改讀本機測試資料，共 ${rows.length} 組資料。`;}render();}
function render(){document.querySelector('#tbl tbody').innerHTML=rows.map((r,i)=>{const d=getData(r);return `<tr><td>${esc(r.group_name)}</td><td>${esc(r.store_name)}</td><td>${esc(d.step0?.typeLabel||r.district_type)}</td><td>${esc(d.step0?.sub?d.step0.sorted?.find(x=>x.type===d.step0.sub)?.label:r.district_subtype)}</td><td>${esc(d.step1?.priority?.recommended||'')}</td><td>${esc(d.final?.winner?.name||'')}</td><td>${esc(r.updated_at)}</td><td><button class="small secondary" onclick="viewRow(${i})">查看</button> <button class="small danger" onclick="deleteRow(${i})">刪除</button></td></tr>`}).join('')}
function kv(k,v){return `<div class="kv"><strong>${esc(k)}</strong><div>${v}</div></div>`}
function renderTable(headers, rows){if(!rows?.length)return '<div class="hint">無資料</div>';return `<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function viewRow(i){const r=rows[i],d=getData(r);let html='';html+=kv('組別',esc(r.group_name))+kv('門店',esc(r.store_name))+kv('商圈判讀',esc(d.step0?.typeLabel||''));html+='<h3>Step 1｜顧客</h3>'+renderTable(['顧客','情境','需求痛點','選擇理由'],(d.step1?.customers||[]).map(x=>[x.name,arr(x.contexts),arr(x.pains),arr(x.reasons)]));html+=kv('優先客群',esc(d.step1?.priority?.recommended||''));html+='<h3>Step 2｜條件</h3>'+kv('可用優勢',esc(arr(d.step2?.strengths)))+kv('待處理限制',esc(arr(d.step2?.limits)))+kv('經營期待',esc(arr(d.step2?.goals)));html+='<h3>Step 3｜限制影響</h3>'+kv('關鍵限制',esc(arr(d.step3?.keyLimits)))+kv('影響',esc(arr(d.step3?.impacts)))+kv('處理方向',esc(arr(d.step3?.directions)));html+='<h3>候選方案</h3>'+renderTable(['客群','方案','理由','需求','條件','限制','測試','指標'],(d.step4?.candidates||[]).map(x=>[x.customer,x.name,x.reason,x.need,x.resource,x.constraint,x.test,x.metric]));html+='<h3>最終方案</h3>'+kv('方案',esc(d.final?.winner?.name||''))+kv('服務客群',esc(d.final?.winner?.customer||''))+kv('測試方式',esc(d.final?.winner?.test||''));html+='<h3>原始資料</h3><pre>'+esc(JSON.stringify(d,null,2))+'</pre>';document.getElementById('detailBody').innerHTML=html;document.getElementById('detailDialog').showModal();}
async function deleteRow(i){const r=rows[i];if(!confirm(`確定刪除「${r.group_name||'未命名'}」？`))return;if(usingBackend){const resp=await fetch('/api/submissions?id='+encodeURIComponent(r.id),{method:'DELETE'});const j=await resp.json();if(!j.ok){alert('刪除失敗');return;}}await load();}
function sheet(name, rows){return `<Worksheet ss:Name="${xml(name)}"><Table>${rows.map(r=>`<Row>${r.map(c=>`<Cell><Data ss:Type="String">${xml(c)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`}
function excel(){const overview=[['組別','門店','商圈判讀','優先客群','最終方案','更新時間']];const coc=[['組別','門店','商圈判讀','顧客需求','可用優勢','待處理限制','關鍵限制','候選方案','最終方案']];rows.forEach(r=>{const d=getData(r);overview.push([r.group_name,r.store_name,d.step0?.typeLabel,d.step1?.priority?.recommended,d.final?.winner?.name,r.updated_at]);coc.push([r.group_name,r.store_name,d.step0?.typeLabel,arr((d.step1?.customers||[]).map(x=>x.name+':'+arr(x.pains))),arr(d.step2?.strengths),arr(d.step2?.limits),arr(d.step3?.keyLimits),arr((d.step4?.candidates||[]).map(x=>x.name)),d.final?.winner?.name]);});const wb=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${sheet('總覽',overview)}${sheet('COCA完整資料',coc)}</Workbook>`;const blob=new Blob(['\ufeff'+wb],{type:'application/vnd.ms-excel;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='COCA_商圈活動完整資料.xls';a.click();URL.revokeObjectURL(a.href);}
document.getElementById('refresh').addEventListener('click',load);document.getElementById('download').addEventListener('click',excel);load();
</script><script>(function(){const ADMIN_PASSWORD='coc-admin';function show(){const g=document.getElementById('adminGate'),c=document.getElementById('adminContent');if(g)g.style.display='none';if(c)c.style.display='';}window.checkAdminPassword=function(){const input=document.getElementById('adminPassword'),msg=document.getElementById('adminLoginMsg');if((input.value||'').trim()===ADMIN_PASSWORD){sessionStorage.setItem('cocAdminAuthed','1');show();}else msg.textContent='密碼不正確，請確認後台密碼。';};document.addEventListener('DOMContentLoaded',function(){const children=Array.from(document.body.children);const wrapper=document.createElement('div');wrapper.id='adminContent';wrapper.style.display='none';children.forEach(el=>{if(el.id!=='adminGate')wrapper.appendChild(el)});document.body.appendChild(wrapper);const gate=document.createElement('div');gate.id='adminGate';gate.className='admin-gate';gate.innerHTML=`<h1>COCA 講師後台</h1><p>此頁僅供講師與工作人員使用。請輸入後台密碼。</p><input id="adminPassword" type="password" placeholder="請輸入後台密碼" onkeydown="if(event.key==='Enter') checkAdminPassword()"><button onclick="checkAdminPassword()">進入後台</button><div id="adminLoginMsg" class="error"></div><p style="font-size:13px;margin-top:16px;">課堂 MVP 預設密碼：coc-admin。</p>`;document.body.insertBefore(gate,wrapper);if(sessionStorage.getItem('cocAdminAuthed')==='1')show();});})();</script></body></html>
